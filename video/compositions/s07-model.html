      <script>
        ;(function () {
          const C = window.CUES.s07
          const B = C.b
          const M = window.STORY.model
          const P = M.profile
          const fmtDate = (iso) => new Date(iso + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' })
          const addDays = (iso, n) => new Date(Date.parse(iso + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10)

          // ---- bubbles (seeded)
          const rnd = HF.rng(7)
          const bubbles = document.getElementById('s07-bubbles')
          const bubs = Array.from({ length: 22 }, () => {
            const b = document.createElement('i')
            b.className = 'bub'
            const s = 10 + rnd() * 26
            b.style.cssText = `width:${s}px;height:${s}px;left:${rnd() * 1920}px;top:${700 + rnd() * 500}px`
            bubbles.appendChild(b)
            return { b, speed: 90 + rnd() * 140, delay: rnd() * 6 }
          })

          // ---- 90-day strip: her real daily everyday spend, with the one-off put back in
          const per = M.perDay.slice()
          const off = M.oneOffs[0]
          const offIdx = Math.round((Date.parse(off.date) - Date.parse(M.firstDay)) / 864e5)
          const days = per.map((v, i) => (i === offIdx ? v + -off.amount : v))
          const cap = 110
          document.getElementById('s07-bars').innerHTML = days.map((v, i) => `<i class="${i === offIdx ? 'big' : ''}" style="height:${Math.max(1.5, (Math.min(v, cap) / cap) * 100)}%"></i>`).join('')
          const barEls = [...document.querySelectorAll('#s07-bars i')]
          document.getElementById('s07-ax0').textContent = fmtDate(M.firstDay)
          document.getElementById('s07-ax1').textContent = fmtDate(addDays(M.firstDay, days.length - 1))
          const counts = M.counts
          const total = Object.values(counts).reduce((a, b) => a + b, 0)
          document.getElementById('s07-axm').textContent = `${total} transactions · ${P.history_days} days`
          const barH = 330
          const avgY = barH + 60 - (P.baseline_daily / cap) * barH
          const avg = document.getElementById('s07-avg')
          avg.style.bottom = `${60 + (P.baseline_daily / cap) * barH}px`
          document.getElementById('s07-avglabel').textContent = `baseline ${HF.money(P.baseline_daily)} a day`
          const ikea = document.getElementById('s07-ikea')
          ikea.innerHTML = `${off.merchant} <b>${HF.money(off.amount)}</b><small>one-off: left out of the baseline</small>`
          ikea.style.left = `${(offIdx / days.length) * 1700 - 40}px`
          ikea.style.top = `-30px`

          // ---- lanes
          document.getElementById('s07-n0').textContent = counts.income
          document.getElementById('s07-m0').textContent = `${M.wage[0].merchant} wage`
          document.getElementById('s07-n1').textContent = counts.fixed
          document.getElementById('s07-m1').textContent = 'rent, energy, insurance'
          document.getElementById('s07-n2').textContent = counts.recurring
          document.getElementById('s07-m2').textContent = M.recurring.join(', ')
          document.getElementById('s07-n3').textContent = counts.discretionary

          // ---- noise formula with her real numbers
          const cfg = M.config
          const p95x = +(cfg.p95_mult * M.p95).toFixed(2)
          const tgt3 = +(cfg.target_mult * P.target_daily).toFixed(2)
          // One plain sentence on screen; the exact rule in small print underneath.
          document.getElementById('s07-formula').innerHTML =
            `More than <span class="res">${HF.money(P.large_expense_threshold)}</span> at once = a one-off` +
            `<small>max( €${cfg.floor}, 1.5 × her usual big buy, 3 × daily goal )</small>`

          // ---- weekday rhythm
          const WD = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun']
          const NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
          const wmax = 1.8
          const wh = 400
          document.getElementById('s07-wbars').innerHTML = WD.map((d) => `<div class="wcol ${d === 'sat' ? 'sat' : ''}"><i style="height:${wh}px"></i><span></span></div>`).join('')
          document.getElementById('s07-wlabels').innerHTML = NAMES.map((n) => `<span class="${n === 'Sat' ? 'sat' : ''}">${n}</span>`).join('')
          document.getElementById('s07-one').style.bottom = `${70 + (1 / wmax) * wh}px`
          const wcols = [...document.querySelectorAll('#s07-wbars .wcol')]
          document.getElementById('s07-wraw').textContent = `Sun ×${M.rawWeekday.sun.toFixed(2)} → ×${P.weekday_factors.sun.toFixed(2)}`

          // ---- goal maths
          const H = window.STORY.hero
          document.getElementById('s07-eq1').innerHTML = `${HF.money(P.baseline_daily)} × (1 − 10%) = <b>${HF.money(P.target_daily)}</b> <span class="dim">a day</span>`
          document.getElementById('s07-captext').innerHTML = `Cap: 90% of (income − fixed costs) = <b>${HF.money(P.affordable_daily)}</b> a day. Her goal fits.`
          const capMax = 50
          gsap.set('#s07-goalm', { left: `${(P.target_daily / capMax) * 100}%` })

          // ---- frozen profile vs ratchet
          const rows = [
            ['Baseline', `${HF.money(P.baseline_daily)} a day`],
            ['Savings goal', '−10%'],
            ['Daily goal', HF.money(P.target_daily)],
            ['One-off above', HF.money(P.large_expense_threshold)],
            ['Weekday range', `×${Math.min(...Object.values(P.weekday_factors)).toFixed(2)} to ×${Math.max(...Object.values(P.weekday_factors)).toFixed(2)}`],
          ]
          document.getElementById('s07-pdl').innerHTML = rows.map(([a, b]) => `<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')
          // A saver who spends 80% of their limit; re-learning each month would set next month's
          // baseline to what they spent: the limit ratchets down 20% (x 0.9 goal) every month.
          const months = 6
          const re = Array.from({ length: months }, (_, i) => P.target_daily * Math.pow(0.8, i))
          const fr = Array.from({ length: months }, () => P.target_daily)
          const RW = 872
          const RH = 380
          const rx = (i) => (i / (months - 1)) * (RW - 60) + 20
          const ry = (v) => RH - 30 - (v / 25) * (RH - 60)
          const step = (arr) => arr.map((v, i) => (i ? `${rx(i)},${ry(arr[i - 1])} ${rx(i)},${ry(v)}` : `${rx(0)},${ry(v)}`)).join(' ')
          document.getElementById('s07-rsvg').innerHTML =
            `<polyline class="rl" points="${step(re)}" fill="none" stroke="#ff7b80" stroke-width="6" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>` +
            `<polyline class="rl" points="${step(fr)}" fill="none" stroke="#00c2ff" stroke-width="6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>` +
            ['Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'].map((m, i) => `<text x="${rx(i)}" y="${RH + 6}" text-anchor="middle" font-family="Onest" font-size="22" fill="#7fa6c6">${m}</text>`).join('')

          const tl = gsap.timeline({ paused: true })
          const drv = HF.driver(tl)

          // ---- ambient
          tl.fromTo('#s07-rays', { x: -60 }, { x: 60, duration: C.dur, ease: 'sine.inOut' }, 0)
          bubs.forEach(({ b, speed, delay }) => tl.fromTo(b, { y: 0, opacity: 0 }, { y: -speed * (C.dur - delay), opacity: 0.9, duration: C.dur - delay, ease: 'none' }, delay))
          tl.fromTo('#s07-chapter', { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' }, 0.2)

          // ---- "Under the hood? No black box."
          tl.fromTo('#s07-t1', { opacity: 0, y: 80, filter: 'blur(10px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.9, ease: 'expo.out' }, B.hood)
          tl.fromTo('#s07-badge', { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: 'back.out(1.6)' }, B.nobox)
          tl.to('#s07-title', { opacity: 0, y: -80, duration: 0.4, ease: 'power2.in' }, B.history - 0.35)

          // ---- the rail: which step is on
          const steps = [...document.querySelectorAll('#s07-rail .step')]
          const stepAt = [B.history, B.aside, B.noise, B.baseline, B.save, B.freeze]
          tl.fromTo('#s07-rail', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, B.history - 0.1)
          drv.add((t) => steps.forEach((s, i) => {
            const on = t >= stepAt[i] && (i === steps.length - 1 || t < stepAt[i + 1])
            s.classList.toggle('on', on)
            s.classList.toggle('done', t >= (stepAt[i + 1] ?? 1e9))
          }))
          const say = (id, at, until) => {
            tl.fromTo(id, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: 'expo.out' }, at)
            tl.to(id, { opacity: 0, y: -30, duration: 0.28, ease: 'power2.in' }, until - 0.3)
          }

          // ---- 1. "The model reads 90 days of history."
          say('#s07-say1', B.history, B.aside)
          tl.fromTo('#s07-strip', { opacity: 0 }, { opacity: 1, duration: 0.3 }, B.history)
          tl.fromTo(barEls, { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: 'back.out(1.7)', stagger: 0.012 }, B.history + 0.1)

          // ---- 2. "It sets aside rent, bills and subscriptions."
          say('#s07-say2', B.aside, B.noise)
          tl.to('#s07-strip', { y: -40, scale: 0.55, transformOrigin: '0% 0%', duration: 0.7, ease: 'power3.inOut' }, B.aside - 0.2)
          ;[0, 1, 2, 3].forEach((i) => tl.fromTo(`#s07-l${i}`, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power4.out' }, B.aside + 0.2 + i * 0.25))
          tl.to(['#s07-l0', '#s07-l1', '#s07-l2'], { opacity: 0.45, duration: 0.5, ease: 'sine.inOut' }, B.aside + 1.9)
          tl.to('#s07-lanes', { opacity: 0, y: 40, duration: 0.35, ease: 'power2.in' }, B.noise - 0.35)

          // ---- 3. "It flags big one-offs as noise..."
          say('#s07-say3', B.noise, B.because)
          tl.to('#s07-strip', { y: 0, scale: 1, duration: 0.7, ease: 'power3.inOut' }, B.noise - 0.3)
          tl.fromTo('#s07-formula', { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: 'expo.out' }, B.noise + 0.5)
          tl.fromTo('#s07-ikea', { opacity: 0, y: 30, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'back.out(2)' }, B.noise + 1.4)
          tl.fromTo(barEls[offIdx], { scaleY: 1 }, { scaleY: 1.06, duration: 0.18, yoyo: true, repeat: 3, ease: 'sine.inOut' }, B.noise + 1.3)
          // "...because one expensive purchase doesn't change who you are": out it goes.
          say('#s07-say3b', B.because, B.baseline)
          tl.to('#s07-formula', { opacity: 0, y: -20, duration: 0.3 }, B.because - 0.2)
          tl.to(barEls[offIdx], { scaleY: 0.04, opacity: 0.35, duration: 0.7, ease: 'power3.inOut' }, B.because + 0.6)
          tl.to('#s07-ikea', { y: -70, opacity: 0, duration: 0.7, ease: 'power3.in' }, B.because + 0.6)

          // ---- 4. "It learns your baseline, and your weekly rhythm..."
          say('#s07-say4', B.baseline, B.save)
          tl.fromTo('#s07-avg', { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: 'power3.inOut' }, B.baseline + 0.1)
          tl.fromTo('#s07-avglabel', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: 'back.out(2)' }, B.baseline + 0.8)
          tl.to('#s07-strip', { opacity: 0, y: -40, duration: 0.4, ease: 'power2.in' }, B.baseline + 1.9)
          tl.fromTo('#s07-week', { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, ease: 'expo.out' }, B.baseline + 2.2)
          // Raw weekday ratios, then shrunk toward 1: the model's real factors.
          const wShrink = B.baseline + 3.4
          drv.add((t) => {
            const grow = HF.prog(t, B.baseline + 2.3, 0.7, 'back.out(1.4)')
            const shrink = HF.prog(t, wShrink, 0.9, 'power3.inOut')
            wcols.forEach((c, i) => {
              const raw = M.rawWeekday[WD[i]]
              const fin = P.weekday_factors[WD[i]]
              const v = (raw + (fin - raw) * shrink) * grow
              c.querySelector('i').style.transform = `scaleY(${v / wmax})`
              const lab = c.querySelector('span')
              lab.textContent = `×${(raw + (fin - raw) * shrink).toFixed(2)}`
              lab.style.bottom = `${(v / wmax) * wh + 12}px`
              lab.style.opacity = shrink > 0.95 ? 1 : 0
            })
          })
          tl.fromTo('#s07-wnote', { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' }, wShrink)
          // "more room on Saturdays"
          tl.fromTo(wcols[5], { y: 0 }, { y: -18, duration: 0.25, yoyo: true, repeat: 1, ease: 'power2.out' }, B.saturday + 0.4)
          tl.to(['#s07-week', '#s07-wnote'], { opacity: 0, y: -30, duration: 0.35, ease: 'power2.in' }, B.save - 0.35)

          // ---- 5. "Then it asks you to save 5, 10 or 20%. Never more than your income allows."
          say('#s07-say5', B.save, B.freeze)
          tl.fromTo('#s07-goal', { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, ease: 'expo.out' }, B.save)
          tl.fromTo('#s07-eq1', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' }, B.save + 1.2)
          tl.fromTo('#s07-cap', { opacity: 0 }, { opacity: 1, duration: 0.4 }, B.cap)
          tl.fromTo('#s07-capfill', { scaleX: 0, width: `${(P.affordable_daily / capMax) * 100}%` }, { scaleX: 1, duration: 0.8, ease: 'power3.out' }, B.cap + 0.1)
          tl.fromTo('#s07-goalm', { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.35, ease: 'back.out(2)' }, B.cap + 0.8)
          tl.to('#s07-goal', { opacity: 0, y: -30, duration: 0.35, ease: 'power2.in' }, B.freeze - 0.35)

          // ---- 6. "And it freezes that profile, so saving is never punished with a tighter limit."
          say('#s07-say6', B.freeze, C.dur + 1)
          tl.fromTo('#s07-freeze', { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, ease: 'expo.out' }, B.freeze)
          tl.fromTo('#s07-lock', { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.5, ease: 'back.out(2.4)' }, B.freeze + 0.5)
          tl.fromTo('#s07-shackle', { y: -5 }, { y: 0, duration: 0.2, ease: 'power4.in' }, B.freeze + 1.0)
          tl.to('#s07-rsvg .rl', { strokeDashoffset: 0, duration: 2.2, ease: 'power1.inOut', stagger: 0.2 }, B.freeze + 1.1)

          window.__timelines['s07'] = tl
        })()
      </script>
    </template>
  </body>
</html>
